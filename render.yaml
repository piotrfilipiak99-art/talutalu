databases:
  - name: talutalu-db
    plan: free
    databaseName: talutalu
    user: talutalu

services:
  - type: web
    name: talutalu-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talutalu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # AI provider (any OpenAI-compatible endpoint). Current: OpenAI direct
      # (rolled back from Gemini - unexplained multi-minute prose-generation
      # latency with no clear cause in the logs). AI_BASE_URL unset means
      # IS_OPENAI=True, which makes the code fall back to OPENAI_API_KEY and
      # the gpt-5-mini/gpt-5-nano model defaults. To go back to Gemini: set
      # AI_BASE_URL to https://generativelanguage.googleapis.com/v1beta/openai/
      # and AI_API_KEY to the Gemini key, both in the Render dashboard.
      - key: AI_API_KEY
        sync: false # set manually in the Render dashboard if using a
                    # non-OpenAI provider; leave unset for direct OpenAI
      - key: OPENAI_API_KEY
        sync: false # the active provider while AI_BASE_URL is unset
      - key: PYTHON_VERSION
        value: 3.13.4

  - type: web
    name: talutalu
    runtime: static
    buildCommand: |
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable flutter-sdk
      ./flutter-sdk/bin/flutter --version
      ./flutter-sdk/bin/flutter build web --release
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
